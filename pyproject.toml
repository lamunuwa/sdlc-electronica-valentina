[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["semana0", "semana1"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--cov=. --cov-fail-under=90"
